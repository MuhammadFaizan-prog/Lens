# Builds the Windows installer for an existing GitHub Release and uploads its three assets
# (installer, blockmap, latest.yml). Same build as docs/Releasing.md (Linux, system NSIS, no wine);
# exists because the Hark sandbox cannot upload release assets. Lens.exe's icon and version info are
# written by scripts/edit-exe.cjs (resedit, pure JS, no wine) and checked below with icoutils.
# Run it from the Actions tab or the API with the release tag (the release must already exist: scripts/release.mjs --no-upload creates it).
name: desktop-release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0 (the release must exist)"
        required: true
permissions:
  contents: write
jobs:
  windows-installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: System packages (NSIS, DejaVu fonts)
        run: sudo apt-get update -q && sudo apt-get install -y -q nsis fonts-dejavu-core
      - name: Version matches the tag
        run: |
          v=$(node -p "require('./apps/desktop/package.json').version")
          test "v$v" = "${{ inputs.tag }}" || { echo "apps/desktop is $v, tag is ${{ inputs.tag }}"; exit 1; }
      - name: Install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund
      - name: Make bundled tools executable
        # npm ci can leave 7zip-bin / app-builder-bin without the exec bit (EACCES on the first run)
        run: chmod +x node_modules/7zip-bin/linux/x64/7za node_modules/app-builder-bin/linux/x64/app-builder
      - name: Fetch on-device models (SHA-256 pinned, git-ignored)
        # RNNoise (export noise reduction), tessdata eng (in-app OCR), Whisper base.en q5_1 + the official
        # whisper.cpp v1.8.2 Windows CLI zip (in-app speech-to-text), and the MSVC runtime DLLs it links
        # (MSVCP140 / VCRUNTIME140 / VCRUNTIME140_1 / VCOMP140). dist-win runs it again (a no-op when done).
        run: node apps/editor/scripts/fetch-models.mjs
      - name: Build editor + installer
        env:
          USE_SYSTEM_MAKENSIS: "1"
          LENS_NO_WINE: "1"
        run: |
          npm run build
          npm run dist:win -w @lens/desktop
      - name: Check the package
        run: |
          ls -la out/desktop
          sudo apt-get install -y -q 7zip
          7z l -tNsis out/desktop/Lens-Setup-*.exe | grep -E "Uninstall Lens.exe|app-64.7z"
          7z e -so -tNsis out/desktop/Lens-Setup-*.exe '$PLUGINSDIR/app-64.7z' > "$RUNNER_TEMP/app-64.7z"
          7z l "$RUNNER_TEMP/app-64.7z" > "$RUNNER_TEMP/app.txt"
          for f in resources/ffmpeg/ffmpeg.exe resources/app.asar.unpacked/node_modules/uiohook-napi/prebuilds/win32-x64/uiohook-napi.node resources/app.asar resources/app-update.yml resources/editor/index.html Lens.exe; do
            grep -F " $f" "$RUNNER_TEMP/app.txt" || { echo "missing $f"; exit 1; }
          done
          # bundled models and the whisper CLI with its DLLs and the MSVC runtime next to it
          m=resources/lens/assets/models
          for f in $m/rnnoise/sh.rnnn $m/tessdata/eng.traineddata $m/whisper/ggml-base.en-q5_1.bin \
                   $m/whisper/win32-x64/whisper-cli.exe $m/whisper/win32-x64/whisper.dll $m/whisper/win32-x64/ggml.dll \
                   $m/whisper/win32-x64/ggml-base.dll $m/whisper/win32-x64/ggml-cpu.dll \
                   $m/whisper/win32-x64/msvcp140.dll $m/whisper/win32-x64/vcruntime140.dll $m/whisper/win32-x64/vcruntime140_1.dll \
                   $m/whisper/win32-x64/vcomp140.dll $m/whisper/win32-x64/VCRUNTIME-NOTICE.txt; do
            grep -F " $f" "$RUNNER_TEMP/app.txt" || { echo "missing $f"; exit 1; }
          done
          if grep -E "$m/whisper/linux-|\.sha256$|\.conda$" "$RUNNER_TEMP/app.txt"; then echo "unexpected files in the payload"; exit 1; fi
          # caption / theme fonts (every builtin: font the engine names) and their licences
          for f in $(grep -oE 'builtin:[A-Za-z0-9-]+\.ttf' packages/engine/src/palette.ts packages/engine/src/translation.ts | sed 's/.*builtin://' | sort -u); do
            grep -F " resources/lens/assets/fonts/$f" "$RUNNER_TEMP/app.txt" || { echo "missing font $f"; exit 1; }
            fam=${f%%-*}; grep -F " resources/lens/assets/fonts/$fam-OFL.txt" "$RUNNER_TEMP/app.txt" > /dev/null || { echo "missing licence for $f"; exit 1; }
          done
          sha256sum out/desktop/Lens-Setup-*.exe out/desktop/latest.yml
      - name: Check Lens.exe carries the Lens icon and version info
        # Lens.exe from the installer payload: its icon group (RT_GROUP_ICON) must decode to the same
        # images as the generated lens.ico (16/24/32/48/64/256), and its version strings must say Lens
        run: |
          sudo apt-get install -y -q icoutils
          d="$RUNNER_TEMP/exe"; mkdir -p "$d/gen" "$d/exe" "$d/want" "$d/got"
          7z e -y -o"$d" "$RUNNER_TEMP/app-64.7z" Lens.exe
          wrestool -x -t14 "$d/Lens.exe" -o "$d/exe/lens.ico"
          node apps/desktop/scripts/make-icon.mjs "$d/gen"
          icotool -l "$d/exe/lens.ico"
          icotool -x -o "$d/want" "$d/gen/lens.ico"
          icotool -x -o "$d/got" "$d/exe/lens.ico"
          (cd "$d/want" && ls) > "$d/want.txt"; (cd "$d/got" && ls) > "$d/got.txt"
          diff "$d/want.txt" "$d/got.txt"
          test "$(wc -l < "$d/want.txt")" -eq 6
          for f in $(cat "$d/want.txt"); do cmp "$d/want/$f" "$d/got/$f"; done
          echo "Lens.exe icon: 6 images, decoded pixels identical to lens.ico"
          wrestool --raw -x -t16 "$d/Lens.exe" | iconv -f UTF-16LE -t UTF-8 -c | tr -c '[:print:]' ' ' | tee "$d/ver.txt" | grep -o 'ProductName *Lens'
          v=${{ inputs.tag }}; grep -q "FileVersion *${v#v}" "$d/ver.txt"
          ! grep -q 'Electron' "$d/ver.txt"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ inputs.tag }}; v=${v#v}
          gh release upload "${{ inputs.tag }}" --repo "${{ github.repository }}" --clobber \
            out/desktop/latest.yml "out/desktop/Lens-Setup-$v.exe" "out/desktop/Lens-Setup-$v.exe.blockmap"
