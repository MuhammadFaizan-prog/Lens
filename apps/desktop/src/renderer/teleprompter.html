<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Lens Teleprompter</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, "Segoe UI", sans-serif; }
      body { margin: 0; background: #0f1115; color: #e8e9ee; display: flex; flex-direction: column; height: 100vh; }
      .bar { display: flex; gap: 8px; align-items: center; padding: 6px 10px; font-size: 12px; color: #9aa0ad; border-bottom: 1px solid #1f232c; }
      .bar button { background: #2b5cff; color: #fff; border: 0; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
      .bar input { width: 90px; }
      #script { flex: 1; resize: none; background: transparent; color: inherit; border: 0; padding: 12px 18px; font-size: 26px; line-height: 1.4; outline: none; }
    </style>
  </head>
  <body>
    <div class="bar"><button id="play" data-testid="prompter-play">Scroll</button> Speed <input id="speed" type="range" min="10" max="120" value="40" /> <span>Hidden from the recording</span></div>
    <textarea id="script" data-testid="prompter-script" placeholder="Paste your script here, then press Scroll."></textarea>
    <script>
      const ta = document.getElementById("script");
      const btn = document.getElementById("play");
      ta.value = localStorage.getItem("lens-script") || "";
      ta.oninput = () => localStorage.setItem("lens-script", ta.value);
      let on = false, last = 0, acc = 0;
      const tick = (t) => {
        if (!on) return;
        const dt = last ? (t - last) / 1000 : 0;
        last = t;
        acc += dt * Number(document.getElementById("speed").value);
        if (acc >= 1) { ta.scrollTop += Math.floor(acc); acc -= Math.floor(acc); }
        requestAnimationFrame(tick);
      };
      btn.onclick = () => { on = !on; last = 0; btn.textContent = on ? "Pause" : "Scroll"; if (on) requestAnimationFrame(tick); };
    </script>
  </body>
</html>
