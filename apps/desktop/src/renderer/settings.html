<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Lens Settings</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #0f1115; color: #e8e9ee; display: grid; grid-template-columns: 150px 1fr; height: 100vh; }
      nav { border-right: 1px solid #1f232c; padding: 14px 8px; display: flex; flex-direction: column; gap: 4px; }
      nav button { text-align: left; background: none; border: 0; color: #c9ccd6; font-size: 13px; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
      nav button.active { background: #18213a; color: #fff; }
      main { padding: 16px 20px; overflow: auto; display: flex; flex-direction: column; }
      section { display: none; flex-direction: column; gap: 14px; }
      section.active { display: flex; }
      h2 { margin: 0 0 4px; font-size: 15px; }
      .row { display: grid; grid-template-columns: 190px 1fr; align-items: center; gap: 10px; font-size: 13px; }
      .row small { grid-column: 2; color: #9aa0ad; font-size: 11px; margin-top: -6px; }
      input[type="text"], select { background: #171a21; color: #e8e9ee; border: 1px solid #2a2e39; border-radius: 6px; padding: 6px 8px; font-size: 12px; width: 100%; }
      .path { display: flex; gap: 6px; }
      button.b { background: #1b1e26; color: #c9ccd6; border: 1px solid #2a2e39; border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; white-space: nowrap; }
      input.key { cursor: pointer; text-align: center; font-family: inherit; }
      input.key:focus { border-color: #2b5cff; outline: none; }
      footer { margin-top: auto; padding-top: 14px; display: flex; align-items: center; gap: 10px; }
      footer .save { background: #2b5cff; color: #fff; border: 0; border-radius: 6px; padding: 7px 16px; font-size: 13px; cursor: pointer; }
      #msg { font-size: 12px; color: #9aa0ad; }
      #msg.err { color: #ff6b6b; }
    </style>
  </head>
  <body>
    <nav>
      <button data-tab="general" class="active" data-testid="tab-general">General</button>
      <button data-tab="record" data-testid="tab-record">Record</button>
      <button data-tab="shortcuts" data-testid="tab-shortcuts">Shortcut Keys</button>
      <button data-tab="export" data-testid="tab-export">Export</button>
    </nav>
    <main>
      <section id="general" class="active">
        <h2>General</h2>
        <label class="row">Save location<span class="path"><input type="text" id="saveDir" data-testid="saveDir" /><button class="b" data-pick="saveDir">Browse…</button></span></label>
        <label class="row">Export location<span class="path"><input type="text" id="exportDir" data-testid="exportDir" /><button class="b" data-pick="exportDir">Browse…</button></span></label>
        <label class="row">Start Lens at login<input type="checkbox" id="autoStart" data-testid="autoStart" /></label>
        <span class="row"><span></span><small id="autoStartNote"></small></span>
        <label class="row">Auto-play when entering the editor<input type="checkbox" id="autoPlay" data-testid="autoPlay" /></label>
        <label class="row">Hardware acceleration<input type="checkbox" id="hardwareAcceleration" data-testid="hardwareAcceleration" /></label>
        <span class="row">GPU<span id="gpu" data-testid="gpu">…</span></span>
        <span class="row"><span></span><small>Turning hardware acceleration on or off applies after Lens restarts.</small></span>
      </section>
      <section id="record">
        <h2>Record</h2>
        <label class="row">Frame rate<select id="fps" data-testid="fps"><option value="30">30 fps</option><option value="60">60 fps</option></select></label>
        <label class="row">Quality<select id="quality" data-testid="quality"><option value="standard">Standard (smaller files)</option><option value="high">High</option><option value="max">Maximum</option></select></label>
        <label class="row">Countdown<select id="countdown" data-testid="countdown"><option value="0">None</option><option value="3">3 seconds</option><option value="5">5 seconds</option></select></label>
        <label class="row">Hide the recorder while recording<input type="checkbox" id="hideWhileRecording" data-testid="hideWhileRecording" /></label>
        <label class="row">Show system cursor by default<input type="checkbox" id="showSystemCursor" data-testid="showSystemCursor" /></label>
      </section>
      <section id="shortcuts">
        <h2>Shortcut Keys</h2>
        <span class="row"><span></span><small>Click a box and press the keys. Backspace clears. Shortcuts work from any app.</small></span>
        <label class="row">Start / stop recording<input class="key" type="text" readonly id="sc-startStop" data-testid="sc-startStop" /></label>
        <label class="row">Record a custom area<input class="key" type="text" readonly id="sc-region" data-testid="sc-region" /></label>
        <label class="row">Pause / resume<input class="key" type="text" readonly id="sc-pause" data-testid="sc-pause" disabled placeholder="Not available yet" /></label>
      </section>
      <section id="export">
        <h2>Export defaults</h2>
        <span class="row"><span></span><small>Used for new recordings; each project can still change them.</small></span>
        <label class="row">Format<select id="format" data-testid="format"><option value="mp4">MP4 (H.264)</option></select></label>
        <label class="row">Resolution<select id="resolution" data-testid="resolution"><option value="720">720p</option><option value="1080">1080p</option><option value="1440">1440p</option><option value="2160">4K</option></select></label>
        <label class="row">Frame rate<select id="exfps" data-testid="exfps"><option value="30">30 fps</option><option value="60">60 fps</option></select></label>
        <label class="row">Bitrate (Mbps, 0 = auto)<input type="text" id="bitrateMbps" data-testid="bitrateMbps" /></label>
      </section>
      <footer><button class="save" id="save" data-testid="save">Save</button><span id="msg" data-testid="msg"></span></footer>
    </main>
    <script>
      const api = window.lensDesktop;
      const $ = (id) => document.getElementById(id);
      let cur = null;
      document.querySelectorAll("nav button").forEach((b) => (b.onclick = () => {
        document.querySelectorAll("nav button").forEach((x) => x.classList.toggle("active", x === b));
        document.querySelectorAll("section").forEach((s) => s.classList.toggle("active", s.id === b.dataset.tab));
      }));
      const label = (a) => (a || "").replace("CommandOrControl", "Ctrl");
      function fill(s) {
        cur = s;
        for (const k of ["saveDir", "exportDir"]) $(k).value = s.general[k];
        for (const k of ["autoStart", "autoPlay", "hardwareAcceleration"]) $(k).checked = s.general[k];
        $("fps").value = String(s.record.fps);
        $("quality").value = s.record.quality;
        $("countdown").value = String(s.record.countdown);
        $("hideWhileRecording").checked = s.record.hideWhileRecording;
        $("showSystemCursor").checked = s.record.showSystemCursor;
        for (const k of ["startStop", "region", "pause"]) { $("sc-" + k).value = label(s.shortcuts[k]); $("sc-" + k).dataset.acc = s.shortcuts[k] || ""; }
        $("resolution").value = String(s.export.resolution);
        $("exfps").value = String(s.export.fps);
        $("bitrateMbps").value = String(s.export.bitrateMbps);
      }
      function collect() {
        return {
          general: { saveDir: $("saveDir").value, exportDir: $("exportDir").value, autoStart: $("autoStart").checked, autoPlay: $("autoPlay").checked, hardwareAcceleration: $("hardwareAcceleration").checked },
          record: { fps: Number($("fps").value), quality: $("quality").value, countdown: Number($("countdown").value), hideWhileRecording: $("hideWhileRecording").checked, showSystemCursor: $("showSystemCursor").checked },
          shortcuts: { startStop: $("sc-startStop").dataset.acc, region: $("sc-region").dataset.acc, pause: $("sc-pause").dataset.acc },
          export: { format: "mp4", resolution: Number($("resolution").value), fps: Number($("exfps").value), bitrateMbps: Number($("bitrateMbps").value) || 0 },
        };
      }
      // key capture -> Electron accelerator
      const KEYMAP = { " ": "Space", ArrowUp: "Up", ArrowDown: "Down", ArrowLeft: "Left", ArrowRight: "Right", Escape: "Esc", "+": "Plus" };
      document.querySelectorAll("input.key").forEach((el) => el.addEventListener("keydown", (e) => {
        e.preventDefault();
        if (["Control", "Shift", "Alt", "Meta"].includes(e.key)) return;
        if (e.key === "Backspace" || e.key === "Delete") { el.dataset.acc = ""; el.value = ""; return; }
        const mods = [e.ctrlKey && "CommandOrControl", e.altKey && "Alt", e.shiftKey && "Shift", e.metaKey && "Super"].filter(Boolean);
        if (!mods.length) { $("msg").textContent = "Use at least one of Ctrl / Alt / Shift"; $("msg").className = "err"; return; }
        let k = KEYMAP[e.key] || (e.code.startsWith("Key") ? e.code.slice(3) : e.code.startsWith("Digit") ? e.code.slice(5) : /^F\d+$/.test(e.key) ? e.key : e.key.length === 1 ? e.key.toUpperCase() : e.key);
        el.dataset.acc = [...mods, k].join("+");
        el.value = label(el.dataset.acc);
        $("msg").textContent = "";
      }));
      document.querySelectorAll("[data-pick]").forEach((b) => (b.onclick = async (e) => {
        e.preventDefault();
        const id = b.dataset.pick;
        const d = await api.settingsPickDir($(id).value);
        if (d) $(id).value = d;
      }));
      $("save").onclick = async () => {
        const r = await api.settingsSet(collect());
        $("msg").className = r.ok ? "" : "err";
        $("msg").textContent = r.ok ? (r.restartNeeded ? "Saved. Restart Lens to apply hardware acceleration." : "Saved.") : r.error;
        if (r.ok) fill(r.settings);
      };
      api.settingsGet().then((r) => {
        fill(r.settings);
        $("gpu").textContent = r.gpu.name + " · acceleration " + r.gpu.acceleration;
        if (r.platform === "linux") { $("autoStart").disabled = true; $("autoStartNote").textContent = "Start at login is available on Windows and macOS."; }
      });
      window.lensSettings = { collect, save: () => $("save").click() };
    </script>
  </body>
</html>
